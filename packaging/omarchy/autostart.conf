# Plain Hyprland, or an Omarchy-managed autostart.conf under ~/.config/omarchy/.
# install.sh --autostart appends this block once.
# nova-letterbox-begin
exec-once = nova-letterbox
windowrule {
    name = nova-letterbox
    match:class = ^(NOVA Letterbox)$
    fullscreen = true
    monitor = HDMI-A-1
}
# nova-letterbox-end
